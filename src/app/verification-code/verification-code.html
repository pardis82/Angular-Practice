<div dir="ltr" class="grid gap-2 sm:grid-cols-5 " [ngClass]="containerClassName()">
    @for (control of verificationValues(); track control ; let i = $index) {
    <input class="border border-gray-300 rounded-md focus:border-purple-300 focus:ring-1 focus:ring-purple-600 focus:outline-none
             transition-all duration-50 text-center" [ngClass]="className()"
        [style.background-color]="backgroundColor()" #codeInput [formControl]="control" type="text"
        [attr.maxlength]="maxLength()" (input)="onInput($event , i)" (keydown)="onKeyDown($event , i)"
        (paste)="onPaste($event , i)">
    }
</div>
