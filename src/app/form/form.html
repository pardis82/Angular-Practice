<h2 class="text-xl font-bold ml-5 mb-4">Angular Form Example</h2>


<div dir="rtl" class="mt-20 p-4 flex justify-center">
    <div class="grid lg:grid-cols-1 md:grid-cols-3 sm:grid-cols-6 gap-3 w-64">
        <app-text-field backgroundColor="#F1F3E0" type="username" label="نام کاربری" helperText=""></app-text-field>
        <app-text-field backgroundColor="#F1F3E0" type="password" label="رمز عبور"
            helperText="رمز عبور باید شامل 8 کاراکتر، حداقل یک حرف کوچک، یک حرف بزرگ ، یک عدد و یکی از کاراکتر های خاص باشد"></app-text-field>
    </div>
</div>

<div dir="rtl" class="mt-20 p-4 flex justify-center">
    <div class="grid lg:grid-cols-1 md:grid-cols-3 sm:grid-cols-6 gap-3 w-64">
        <app-text-field backgroundColor="#F1F3E0" [showValidationUI]="false" type="username" label="نام کاربری"
            helperText=""></app-text-field>
        <app-text-field [showValidationUI]="false" backgroundColor="#F1F3E0" type="password" label="رمز عبور"
            helperText="رمز عبور باید شامل 8 کاراکتر، حداقل یک حرف کوچک، یک حرف بزرگ ، یک عدد و یکی از کاراکتر های خاص باشد"></app-text-field>
    </div>
</div>
