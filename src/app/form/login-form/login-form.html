<div dir="rtl" class="mt-2 p-4 flex justify-center">
    <div class="grid lg:grid-cols-1 gap-4 w-80">
        <app-text-field 
            [showValidationUI]="false" 
            label="نام کاربری" 
            placeholder="نام کاربری خود را وارد کنید"
            backgroundColor="#F1F3E0" 
            type="username" 
            [(value)]="username">
        </app-text-field>

        <app-text-field 
            [showValidationUI]="false" 
            label="رمز عبور" 
            placeholder="رمز عبور خود را وارد کنید"
            backgroundColor="#F1F3E0" 
            type="password" 
            [(value)]="password">
        </app-text-field>

        <!-- Change to regular button -->
        <button 
            type="button" 
            (click)="onSubmit()"
            [disabled]="!isFormValid()"
            class="w-full py-3 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-70">
            ورود به سیستم
        </button>
    </div>
</div>
