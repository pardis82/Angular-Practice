<div [class]="colSpan() || containerClassName() || 'w-full'" dir="rtl" style="--input-bg: #ffe2e2">
    <div class="relative w-full rounded-lg px-3 py-3 bg-[color:var(--input-bg)]">

        <!-- FIELDSET (border colors) -->
        <fieldset dir="rtl" class="absolute inset-0 pointer-events-none rounded-lg border transition-colors" [ngClass]="{
        'border-red-400': !!errorMessage(),
        'border-purple-500': !errorMessage() && isFocused,
        'border-gray-300': !errorMessage() && !isFocused,
        'border-green-400': type() === 'password' && unmetPasswordRules.length === 0 && hasValue
      }" aria-hidden="true">
            <legend *ngIf="label() && float" class="h-0 overflow-hidden transition-all duration-150 pl-2">
                <span class="text-xs opacity-0 px-1 inline-block whitespace-nowrap" style="max-width: calc(100% - 8px)">
                    {{ label() }}
                </span>
            </legend>
        </fieldset>

        <!-- MULTILINE TEXTAREA -->
        <textarea *ngIf="multiline()" #textareaRef [id]="id()" [name]="name() || id()" [value]="actualValue"
            (input)="onInputChange($event); adjustTextareaHeight(textareaRef)" (focus)="onFocus()" (blur)="onBlur()"
            [rows]="minrows() || 3"
            class="w-full bg-transparent outline-none text-xs leading-normal font-sans text-right resize-none"
            [ngClass]="[className() || '', errorMessage() ? 'text-red-600' : '']"
            [placeholder]="float ? truncatedPlaceholder : ''"></textarea>

        <!-- SINGLE LINE INPUT -->
        <div *ngIf="!multiline()" class="relative">
            <input [type]="actualType" [id]="id()" [name]="name() || id()" [value]="actualValue"
                (input)="onInputChange($event)" (focus)="onFocus()" (blur)="onBlur()"
                class="w-full bg-transparent outline-none text-xs leading-normal font-sans text-right pr-1"
                [ngClass]="[className() || '', errorMessage() ? 'text-red-600' : '']"
                [placeholder]="float ? truncatedPlaceholder : ''" />

            <!-- PASSWORD TOGGLE & STRENGTH -->
            <div *ngIf="type() === 'password' && hasValue" class="mt-2">

                <!-- Strength bar -->
                <div class="w-full bg-gray-300 rounded h-1 mb-1 px-2 ">
                    <div class="h-full rounded transition-all duration-200 -mx-2 "
                        [style.width.%]="passwordStrengthPercent+2.75 " [class]="passwordStrengthColor"></div>
                </div>

                <!-- Toggle button -->
                <button type="button" (click)="togglePasswordVisibility()"
                    class="absolute left-0 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 transition-colors duration-200 p-1">
                    <!-- visible -->
                    <svg *ngIf="isPasswordVisible" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10.73 5.08a10.75 10.75 0 0 1 11.2 6.57a1 1 0 0 1 0 .7a10.8 10.8 0 0 1-1.44 2.49m-6.41-.68a3 3 0 0 1-4.24-4.25">
                        </path>
                        <path
                            d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15a1 1 0 0 1 0-.7a10.75 10.75 0 0 1 4.45-5.14M2 2l20 20">
                        </path>
                    </svg>

                    <!-- hidden -->
                    <svg *ngIf="!isPasswordVisible" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21.26 10.96c.47.62.47 1.46 0 2.07C19.76 14.99 16.18 19 12 19S4.24 14.99 2.74 13.03a1.7 1.7 0 0 1 0-2.07C4.24 9.01 7.82 5 12 5s7.76 4.01 9.26 5.96Z">
                        </path>
                        <path d="M12 15a3 3 0 1 0 0-6a3 3 0 0 0 0 6Z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- FLOATING LABEL -->
        <label *ngIf="label()" [for]="id()"
            class="absolute transition-all duration-150 px-1 font-sans pointer-events-none right-2" [ngClass]="[
  float ? 'text-xs -top-[0.7rem] text-purple-600' : 'top-1/2 -translate-y-1/2 text-[11.5px]',
  errorMessage() && hasValue ? 'text-red-500' : '',
  !errorMessage() && float && type() === 'password' && unmetPasswordRules.length === 0 && hasValue
    ? 'text-green-600'
    : '',
  !errorMessage() && float && type() === 'password'
    ? 'text-purple-600'
    : ''
]">
            {{ label() }}
        </label>
    </div>

    <!-- ERROR MESSAGE -->
    <p *ngIf="errorMessage()" class="text-red-500 font-sans text-[12.5px] mt-1 mr-1">
        {{ errorMessage() }}
    </p>

    <!-- PASSWORD HELPER TEXT -->
    <div *ngIf="type() === 'password' && unmetPasswordRules.length >0 && !errorMessage() && helperText()"
        class="text-gray-500 font-sans text-[12.5px] mt-1 mr-1">
        <p>{{helperText()}}</p>
        <ul>
            <li *ngFor="let rule of unmetPasswordRules">{{ rule }}</li>
        </ul>
    </div>

    <!-- PASSWORD IS STRONG -->
    <div *ngIf="type() === 'password' && unmetPasswordRules.length === 0 && hasValue"
        class="text-xs text-green-600 mt-1 flex items-center gap-1">
        <svg width="10" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        پسورد قوی است.
    </div>
</div>
